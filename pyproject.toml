[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "synaps-mobiroute"
version = "0.4.0"
description = "Vehicle routing engine for heterogeneous fleets: VRPTW, PDPTW and DARP with ALNS on a Rust kernel, exact CP-SAT and MIP models, an OR-Tools baseline, live dispatch and an independent verifier"
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Dmitrij Konkov" }]
maintainers = [{ name = "Dmitrij Konkov" }]
keywords = [
  "vehicle-routing",
  "VRP",
  "VRPTW",
  "PDPTW",
  "DARP",
  "heterogeneous-fleet",
  "pickup-and-delivery",
  "ALNS",
  "metaheuristics",
  "mixed-integer-programming",
  "cp-sat",
  "or-tools",
  "rust",
  "logistics",
  "dispatch",
  "operations-research",
]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Science/Research",
  "Intended Audience :: Developers",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Typing :: Typed",
  "Topic :: Scientific/Engineering",
  "Topic :: Scientific/Engineering :: Mathematics",
]
dependencies = [
  "pydantic>=2.7",
  "ortools>=9.10",
  "jsonschema>=4.20",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "pytest-cov>=6.0",
  "ruff>=0.8",
  "mypy>=1.13",
  "hypothesis>=6.100",
  "types-jsonschema>=4.20",
]
native = [
  "maturin>=1.7,<2",
]

[project.urls]
Homepage = "https://github.com/KonkovDV/SynAPS-MobiRoute"
Repository = "https://github.com/KonkovDV/SynAPS-MobiRoute"
Documentation = "https://github.com/KonkovDV/SynAPS-MobiRoute/tree/main/docs"
Issues = "https://github.com/KonkovDV/SynAPS-MobiRoute/issues"
Changelog = "https://github.com/KonkovDV/SynAPS-MobiRoute/blob/main/CHANGELOG.md"
Security = "https://github.com/KonkovDV/SynAPS-MobiRoute/blob/main/SECURITY.md"

[project.scripts]
mobiroute = "mobiroute.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
mobiroute = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "."]
addopts = "-q -m 'not slow'"
markers = [
  "slow: exact MIP proofs on full benchmark instances (run with -m slow)",
]

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["src", "tests", "benchmark"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "C4", "RUF"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["T20"]
"benchmark/**" = ["T20", "E501"]  # Markdown table literals

[tool.mypy]
python_version = "3.12"
strict = true
packages = ["mobiroute"]
mypy_path = "src"
warn_unused_ignores = true

[[tool.mypy.overrides]]
module = ["mobiroute_native"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["ortools.*"]
ignore_missing_imports = true
disallow_untyped_calls = false

[[tool.mypy.overrides]]
module = ["mobiroute.solvers.cpsat"]
disable_error_code = ["attr-defined", "type-arg", "operator", "misc"]
