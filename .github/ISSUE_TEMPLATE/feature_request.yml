name: Feature request
description: Propose a modelling feature, solver or benchmark
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: Which routing situation is not covered today?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposal
      description: Model change, algorithm or data; how would the verifier check it?
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: How to measure it
      description: Instance, benchmark or test that shows the change works.
