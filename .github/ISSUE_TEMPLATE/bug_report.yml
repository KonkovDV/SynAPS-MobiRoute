name: Bug report
description: Report a wrong plan, a crash or a determinism problem
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Please attach a public or synthetic instance and the seed. Do not include personal data.
  - type: textarea
    id: what
    attributes:
      label: What happened
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Reproduction (instance, solver, seed, command)
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: MobiRoute version / commit
    validations:
      required: true
