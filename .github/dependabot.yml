version: 2
updates:
  - package-ecosystem: pip
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      python-dev:
        patterns: ["pytest*", "ruff", "mypy", "hypothesis", "types-*"]
      python-runtime:
        patterns: ["ortools", "pydantic", "jsonschema"]

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      actions:
        patterns: ["*"]

  - package-ecosystem: cargo
    directory: "/native/mobiroute_native"
    schedule:
      interval: weekly
    open-pull-requests-limit: 3
