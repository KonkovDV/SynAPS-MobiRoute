name: Security

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "17 5 * * 1"

permissions:
  contents: read

jobs:
  python-dependencies:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Audit installed packages (OSV / PyPI advisories)
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]" pip-audit
          pip-audit --skip-editable

  rust-dependencies:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
      - name: Audit Cargo.lock (RustSec)
        run: |
          cargo install cargo-audit --locked
          cargo audit --file native/mobiroute_native/Cargo.lock
