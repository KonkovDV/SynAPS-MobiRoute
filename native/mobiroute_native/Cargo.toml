[package]
name = "mobiroute_native"
version = "0.5.0"
edition = "2021"
description = "Required PyO3 hot path for MobiRoute DARP insertion scoring"
license = "MIT"

[lib]
name = "mobiroute_native"
crate-type = ["cdylib"]

[dependencies]
pyo3 = { version = "0.29", features = ["extension-module"] }
rayon = "1.10"

[profile.release]
lto = "fat"
codegen-units = 1
opt-level = 3
panic = "abort"
strip = true

[lints.clippy]
# PyO3 entry points and the insertion hot path pass flat buffers by design:
# bundling them into structs would add a copy per call across the FFI boundary.
too_many_arguments = "allow"
type_complexity = "allow"
# Insertion positions index several parallel arrays (prefix states, stops).
needless_range_loop = "allow"
